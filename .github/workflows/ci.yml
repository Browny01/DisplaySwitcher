name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || true
      - name: Build
        run: |
          xcodebuild -project DisplaySwitcher.xcodeproj \
            -scheme DisplaySwitcher \
            -configuration Release \
            -destination 'platform=macOS' \
            build
      - name: Test
        run: |
          xcodebuild -project DisplaySwitcher.xcodeproj \
            -scheme DisplaySwitcherTests \
            -destination 'platform=macOS' \
            test
